name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      
      - run: npm ci --ignore-scripts
      - run: node scripts/install-opa.mjs && .tools/opa check policy
      - run: npm run verify
      - run: .tools/opa check integrations/spacelift/policy.rego && git diff --exit-code -- integrations/spacelift/policy.rego
      - run: mkdir -p artifacts && node dist/src/main.js demo > artifacts/output.json && cmp samples/output.json artifacts/output.json
      
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t stackguard:ci .
      - run: node scripts/container-smoke.mjs stackguard:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/workbench.png
            samples/output.json
            artifacts/
          if-no-files-found: warn
          retention-days: 14
